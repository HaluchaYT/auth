name: multitenant

on:
  pull_request:
  push:
    branches: [feat/tenant-schema-routing, main]

permissions:
  contents: read

jobs:
  unit:
    name: Tenant package + boundary lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint — tenant boundary
        run: bash scripts/lint-tenant-boundary.sh

      - name: Test — tenant package
        run: go test -race -count=1 ./internal/tenant/...

      - name: Test — storage tenant helpers (no DB)
        run: go test -race -count=1 -run 'Tenant' ./internal/storage/

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: make check-format

  full-suite:
    # Mirrors upstream's "Test / Postgres" job on a GitHub-hosted runner
    # (upstream pins Blacksmith runners, which a fork does not have), and
    # additionally enables the gated end-to-end tenant isolation test.
    name: Full suite + tenant isolation (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Init database
        run: psql -f hack/init_postgres.sql postgresql://postgres:root@localhost:5432/postgres

      - name: Run migrations
        run: make migrate_dev

      - name: Provision tenant schemas (the documented production path)
        # Create each tenant schema, then run the upstream migrations with
        # the namespace AND the DSN search_path pointed at it, so tables and
        # the migrator's own schema_migrations land in the tenant schema.
        env:
          SUPER_URL: postgresql://postgres:root@localhost:5432/postgres
          AUTH_URL: postgres://supabase_auth_admin:root@localhost:5432/postgres
        run: |
          set -euo pipefail
          for s in t_one_auth t_two_auth; do
            psql "$SUPER_URL" -c "create schema if not exists $s authorization supabase_auth_admin"
            DB_NAMESPACE="$s" GOTRUE_DB_NAMESPACE="$s" \
            DATABASE_URL="${AUTH_URL}?search_path=${s}" GOTRUE_DB_DATABASE_URL="${AUTH_URL}?search_path=${s}" \
              go run main.go migrate -c hack/test.env
            psql "$SUPER_URL" -c "select count(*) as tables from pg_tables where schemaname = '$s'"
          done

      - name: Run tests (upstream suite + TestCrossTenantIsolation)
        env:
          GOTRUE_MULTITENANT_TEST: "1"
        run: go test ./... -p 1 -race -count=1
