name: build-image

on:
  push:
    branches: [feat/tenant-schema-routing, main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/auth"
          repo="${repo,,}"                  # lowercase for GHCR
          sha_short="${GITHUB_SHA::7}"
          tags="${repo}:multi-tenant"
          tags="${tags},${repo}:${sha_short}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags},${repo}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
